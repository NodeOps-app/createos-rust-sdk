[package]
name = "createos"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Async Rust SDK for CreateOS cloud sandboxes"
license = "MIT"
repository = "https://github.com/NodeOps-app/createos-rust-sdk"
keywords = ["createos", "sandbox", "cloud", "sdk"]
categories = ["api-bindings", "development-tools"]

[dependencies]
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", features = ["serde"] }
futures-util = "=0.3.34"
rand = "=0.10.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "query"] }
percent-encoding = "=2.3.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "=2.5.8"

[dev-dependencies]
axum = "=0.8.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
